[project]
name = "pqfw"
version = "0.1.0"
description = "Post-quantum forensic attribution for multi-recipient encrypted documents"
requires-python = ">=3.9"
dependencies = [
    "kyber-py>=1.0",
    "dilithium-py>=1.0",
    "cryptography>=42.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "eval_type_backport",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
pqfw = "pqfw.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pqfw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
